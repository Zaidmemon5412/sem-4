<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">Update Student</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control" name="name" value="{{ student.std_name }}">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" name="email" value="{{ student.email }}">
        </div>

        <div class="mb-3">
            <label>Age</label>
            <input type="number" class="form-control" name="age" value="{{ student.age }}">
        </div>

        <div class="mb-3">
            <label>Course</label>
            <input type="text" class="form-control" name="course" value="{{ student.course }}">
        </div>

        <div class="mb-3">
            <label>City</label>
            <input type="text" class="form-control" name="city" value="{{ student.city }}">
        </div>

        <button type="submit" class="btn btn-success">
            Update Student
        </button>

        <a href="{% url 'home' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
